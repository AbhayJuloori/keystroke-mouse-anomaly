[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kma"
version = "0.1.0"
description = "Keystroke and mouse anomaly detection benchmark"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6",
  "pandas==3.1.0",
  "scikit-learn==1.9.1",
  "torch==2.14.1",
  "shap==0.51.0",
  "mlflow==3.17.2",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "PyYAML==6.0.3",
  "matplotlib==3.11.2",
  "joblib==1.6.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
